remote_theme: galette/theme-ghpages

title: Galette Events
description: Event and booking management
author: Johan Cwiklinski

# This plugin is developed and maintained by the Galette core team, unlike most
# of the repositories in this organisation — hence the pill in the header.
maintainer: core

# Releases are built and published by GitHub Actions, so no version is declared
# here: the theme reads the latest release and derives both download URLs from
# `archive`. Nothing to bump at release time.
plugin:
  name: Events
  archive: galette-plugin-events
  min_galette: "1.3.0"

# GitHub issues are disabled on this repository; the tracker is the Redmine
# project, as for Galette itself.
tracker_url: https://bugs.galette.eu/projects/evenements

# The theme takes the language from the first path segment and the page identity
# from the file name, so a translation Weblate adds needs nothing here.
defaults:
  - scope: {path: ""}
    values: {layout: default}

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
